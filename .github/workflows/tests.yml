name: Program tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install Solana CLI (Agave 3.1.10)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          key: ${{ runner.os }}-arva-${{ hashFiles('Cargo.lock') }}

      - name: Build program (SBF)
        run: cargo build-sbf --manifest-path programs/arva/Cargo.toml

      - name: Run LiteSVM tests
        run: cargo test
